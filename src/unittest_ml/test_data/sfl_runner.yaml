# SFL runner config for unittest_fl_vs_sfl.py
general:
  training_rounds: 3
  device: cpu

logger:
  name: "fl_vs_sfl_sfl"
  path: "./.training_results/"
  prefix: "sfl"

node_yamls:
  client_yaml: ./test_data/sfl_client.yaml
  server_yaml: ./test_data/sfl_server.yaml

client_nodes:
  group-1:
    number: 2
    id_prefix: client
    yaml: client_yaml
    link_to: server-1

server_node:
  id: server-1
  yaml: server_yaml

strategy:
  strategy_name: sfl
  role: runner
