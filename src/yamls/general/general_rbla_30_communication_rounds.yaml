# RblaRunner iterates from zero through training_rounds inclusive.
# A value of 29 therefore executes exactly 30 communication rounds (0--29).
general:
  device: cpu
  training_rounds: 29
  train_optimization:
    cudnn_benchmark: true
    pin_memory: true
    fused_optimizer: false
    torch_compile: false
    non_blocking_transfer: true
