#-----------------------------
# Client node selection - RepuFL (problem_methods only)
#-----------------------------
client_selection:
  method: repufl
  round: 1
  number: 2
  random_seed: 42
  repufl_ewma_alpha: 0.7
  repufl_weight_accuracy:    0.25
  repufl_weight_quality:     0.25
  repufl_weight_willingness: 0.25
  repufl_weight_consistency: 0.25
  repufl_use_willingness: false
  repufl_force_explore_slots: 1
  repufl_force_explore_when_k2: true
