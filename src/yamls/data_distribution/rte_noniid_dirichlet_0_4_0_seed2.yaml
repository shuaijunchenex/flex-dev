# Seeded Dirichlet training-data distribution.
# dataset=rte; alpha=0.4; seed=2; clients=10; split=train
# Column label IDs: [0, 1]
# Column label names: ["entailment", "not_entailment"]
# Class totals: [1249, 1241]; total_samples=2490
# Source: .dataset/glue/rte/0.0.0/bcdcba79d07bc864c1c254ccfcedcce55bcc9a8c/glue-train.arrow
# Source SHA256: e23cc8fcb595681fdea534aa528d987fd9a1fd16bd6604dfaa66421efbc9b337
# Only the training split is partitioned; validation is reserved for evaluation.
# RNG: Python 3.9 random.Random(seed); reset for each dataset/alpha/seed.
# Per class in ascending label order: draw 10 gammavariate(alpha, 1.0)
# weights, then random.choices(range(10), weights=weights, k=class_total).
# Redraw the whole matrix with the continuing RNG if any client is empty; attempts=1.
# Client sample counts: [87, 153, 404, 349, 183, 725, 62, 308, 91, 128]

data_distribution:
  use: rte_dirichlet_0_4_0_seed2
  custom_define:
    rte_dirichlet_0_4_0_seed2: [
      [0, 87],
      [150, 3],
      [135, 269],
      [108, 241],
      [47, 136],
      [594, 131],
      [50, 12],
      [0, 308],
      [77, 14],
      [88, 40]
    ]
