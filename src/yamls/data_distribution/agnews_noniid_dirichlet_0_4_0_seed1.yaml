# Seeded Dirichlet training-data distribution.
# dataset=agnews; alpha=0.4; seed=1; clients=10; split=train
# Column label IDs: [0, 1, 2, 3]
# Column label names: ["World","Sports","Business","Sci/Tech"]
# Class totals: [30000, 30000, 30000, 30000]; total_samples=120000
# Source: .dataset/datasets/AG_NEWS/train.csv
# RNG: Python 3.9 random.Random(seed); reset for each dataset/alpha/seed.
# Per class in ascending label order: draw 10 gammavariate(alpha, 1.0)
# weights, then random.choices(range(10), weights=weights, k=class_total).
# Redraw the whole matrix with the continuing RNG if any client is empty; attempts=1.
# Client sample counts: [2657, 5551, 3481, 13411, 11726, 4066, 6475, 14933, 28848, 28852]

