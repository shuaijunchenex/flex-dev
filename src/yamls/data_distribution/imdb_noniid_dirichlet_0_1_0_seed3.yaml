# Seeded Dirichlet training-data distribution.
# dataset=imdb; alpha=0.1; seed=3; clients=10; split=train
# Column label IDs: [0, 1]
# Column label names: ["neg","pos"]
# Class totals: [12500, 12500]; total_samples=25000
# Source: .dataset/hf_datasets/imdb/plain_text/0.0.0/e6281661ce1c48d982bc483cf8a173c1bbeb5d31/imdb-train.arrow
# RNG: Python 3.9 random.Random(seed); reset for each dataset/alpha/seed.
# Per class in ascending label order: draw 10 gammavariate(alpha, 1.0)
# weights, then random.choices(range(10), weights=weights, k=class_total).
# Redraw the whole matrix with the continuing RNG if any client is empty; attempts=4.
# Client sample counts: [1, 49, 1750, 4, 9685, 18, 594, 12, 194, 12693]

data_distribution:
  use: imdb_dirichlet_0_1_0_seed3
  custom_define:
    imdb_dirichlet_0_1_0_seed3: [
      [1, 0],
      [49, 0],
      [2, 1748],
      [0, 4],
      [0, 9685],
      [0, 18],
      [0, 594],
      [7, 5],
      [0, 194],
      [12441, 252]
    ]
