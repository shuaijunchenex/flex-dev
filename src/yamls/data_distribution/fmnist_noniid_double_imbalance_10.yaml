#-----------------------------
# Data distribution section — double imbalance (long-tail) for Fashion-MNIST
# 10 clients, 6000 samples per class, all data used
#-----------------------------
data_distribution:

  use: fmnist_double_imbalance          

  custom_define:
    fmnist_double_imbalance: [
        [600, 0, 0, 0, 0, 0, 0, 0, 0, 0],
        [600, 666, 0, 0, 0, 0, 0, 0, 0, 0],
        [600, 666, 750, 0, 0, 0, 0, 0, 0, 0],
        [600, 666, 750, 857, 0, 0, 0, 0, 0, 0],
        [600, 666, 750, 857, 1000, 0, 0, 0, 0, 0],
        [600, 666, 750, 857, 1000, 1200, 0, 0, 0, 0],
        [600, 666, 750, 857, 1000, 1200, 1500, 0, 0, 0],
        [600, 666, 750, 857, 1000, 1200, 1500, 2000, 0, 0],
        [600, 666, 750, 857, 1000, 1200, 1500, 2000, 3000, 0],
        [600, 672, 750, 858, 1000, 1200, 1500, 2000, 3000, 6000]
    ]